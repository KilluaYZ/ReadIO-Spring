# ReadIO 开发环境 Logstash 管道
# 对应 logback-spring.xml 中四个 LogstashTcpSocketAppender 的端口
input {
  tcp {
    port => 4560
    codec => json
    type => "debug"
  }
  tcp {
    port => 4561
    codec => json
    type => "error"
  }
  tcp {
    port => 4562
    codec => json
    type => "business"
  }
  tcp {
    port => 4563
    codec => json
    type => "record"
  }
  tcp {
    mode => "server"
    port => 5044
    codec => json 
    host => "localhost"
  }
  # 从MongoDB导入
  mongodb {
    uri => "mongodb://readio:readio@readio-mongodb-dev:26007/readio?authSource=admin"

    # 占位 sqlite 文件，Logstash 用于记录读到哪一条了
    placeholder_db_dir => "/usr/share/logstash/mongodb_state"
    placeholder_db_name => "logstash_mongo_books.db"

    # 只同步存储书籍的collection
    collection => "^books$" 

    # 每次拉多少条
    batch_size => 1000 

    # 把Mongo的_id转换成字段
    generateId => true
  }
}

output {
  # 开发环境：输出到控制台，便于查看
  stdout {
    codec => rubydebug
  }

  # 输出到 Elasticsearch 
  elasticsearch {
    hosts => ["http://readio-elasticsearch-dev:9200"]
    index => "readio-content"
    document_id => "%{[_id]}" # 把Mongo的_id作为文档的ID
  }
}
