services:
  postgres:
    image: docker.io/library/postgres:latest
    container_name: readio-postgres-dev
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c max_connections=200
    environment:
      POSTGRES_USER: readio
      POSTGRES_PASSWORD: readio
      POSTGRES_DB: readio
    ports:
      - "26001:5432"
    volumes:
      - readio_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readio -d readio"]
      interval: 5s
      timeout: 5s
      retries: 5

  debezium-server:
    image: quay.io/debezium/server:latest
    container_name: readio-debezium-server-dev
    environment:
      DEBEZIUM_LOGGING__LEVEL: INFO

      # 源：PostgreSQL（与上面的 postgres 服务对应）
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: readio-postgres-dev
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: readio
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: readio
      DEBEZIUM_SOURCE_DATABASE_DBNAME: readio
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
      DEBEZIUM_SOURCE_SLOT_NAME: readio_cdc_slot
      DEBEZIUM_SOURCE_PUBLICATION_NAME: readio_cdc_pub
      # 只监听核心表，后续可根据需要扩展
      DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST: public.bms_book,public.cms_post

      # Sink：RabbitMQ，将变更事件投递到 readio.cdc 交换机
      DEBEZIUM_SINK_TYPE: rabbitmq
      DEBEZIUM_SINK_RABBITMQ_CONNECTION_HOST: readio-rabbitmq-dev
      DEBEZIUM_SINK_RABBITMQ_CONNECTION_PORT: 5672
      DEBEZIUM_SINK_RABBITMQ_CONNECTION_USERNAME: readio
      DEBEZIUM_SINK_RABBITMQ_CONNECTION_PASSWORD: readio
      # 与 readio-search 中 CdcRabbitConfig 的 EXCHANGE / ROUTING_KEY 保持一致
      DEBEZIUM_SINK_RABBITMQ_EXCHANGE: readio.cdc
      DEBEZIUM_SINK_RABBITMQ_ROUTINGKEY_SOURCE: static
      DEBEZIUM_SINK_RABBITMQ_ROUTINGKEY: readio.cdc.postgres
      # 使用 JSON 格式，便于 CdcEventListener 用 Jackson 解析
      DEBEZIUM_FORMAT_KEY: json
      DEBEZIUM_FORMAT_VALUE: json
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: readio-redis-dev
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "26002:6379"
    volumes:
      - readio_redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://readio:readio@localhost:6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: docker.io/library/rabbitmq:latest
    container_name: readio-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: readio
      RABBITMQ_DEFAULT_PASS: readio
    ports:
      - "26011:5672"   # AMQP
      - "26012:15672"  # 管理控制台：http://localhost:26012
    restart: unless-stopped

  # 与本地 docker run 成功参数一致：standalone + 内嵌 Derby，无 MySQL
  nacos:
    image: docker.io/nacos/nacos-server:latest
    container_name: readio-nacos-dev
    hostname: nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_TOKEN=VGhpc0lzQVNlY3JldEtleUZvck5hY29zRGV2RW52aXJvbm1lbnQ=
      - NACOS_AUTH_IDENTITY_KEY=readio-nacos-dev
      - NACOS_AUTH_IDENTITY_VALUE=readio-nacos-dev
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    volumes:
      - readio_nacos_logs:/home/nacos/logs
      - readio_nacos_data:/home/nacos/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  
  minio:
    image: docker.io/minio/minio:latest
    container_name: readio-minio-dev
    environment:
      MINIO_ROOT_USER: readio
      MINIO_ROOT_PASSWORD: readio123
    ports:
      - "26003:9000"   # API
      - "26004:9001"   # Console 控制台（固定端口，避免每次随机）
    volumes:
      - readio_minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: readio-milvus-etcd-dev
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "8589934592"
      ETCD_SNAPSHOT_COUNT: "50000"
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://readio-milvus-etcd-dev:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://readio-milvus-etcd-dev:2380
      ETCD_INITIAL_CLUSTER: readio-milvus-etcd-dev=http://readio-milvus-etcd-dev:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_NAME: readio-milvus-etcd-dev
    volumes:
      - readio_milvus_etcd_data:/etcd
    restart: unless-stopped

  milvus-minio:
    image: docker.io/minio/minio:latest
    container_name: readio-milvus-minio-dev
    environment:
      MINIO_ROOT_USER: milvusadmin
      MINIO_ROOT_PASSWORD: milvusadmin
    volumes:
      - readio_milvus_minio_data:/minio_data
    command: server /minio_data
    restart: unless-stopped

  milvus:
    image: docker.io/milvusdb/milvus:v2.6.11
    container_name: readio-milvus-dev
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: readio-milvus-etcd-dev:2379
      MINIO_ADDRESS: readio-milvus-minio-dev:9000
      MINIO_ACCESS_KEY: milvusadmin
      MINIO_SECRET_KEY: milvusadmin
      MINIO_BUCKET_NAME: milvus-bucket
    ports:
      - "26005:19530" # Milvus gRPC
      - "26006:9091" # Milvus HTTP / metrics
    volumes:
      - readio_milvus_data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    restart: unless-stopped

  # GridFS 无需额外配置，使用 MongoDB 自带能力（fs / book_content 等桶由应用自动创建）
  mongodb:
    image: docker.io/library/mongo:latest
    container_name: readio-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: readio
      MONGO_INITDB_ROOT_PASSWORD: readio
      MONGO_INITDB_DATABASE: readio
    ports:
      - "26007:27017"
    volumes:
      - readio_mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  logstash:
    build:
      context: ./logstash
      dockerfile: Dockerfile
    container_name: readio-logstash-dev
    environment:
      # 开发环境限制 JVM 堆，避免占满内存
      LS_JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "4560:4560"
      - "4561:4561"
      - "4562:4562"
      - "4563:4563"
      - "5044:5044"
    volumes:
      - ./logstash/readio.conf:/usr/share/logstash/pipeline/readio.conf:ro
    restart: unless-stopped


  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: readio-elasticsearch-dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "26008:9200"   # HTTP
      - "26009:9300"   # Transportda
    volumes:
      - readio_elasticsearch_data:/usr/share/elasticsearch/data
      - readio_elasticsearch_plugins:/usr/share/elasticsearch/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.5
    container_name: readio-kibana-dev
    environment:
      - ELASTICSEARCH_HOSTS=http://readio-elasticsearch-dev:9200
      - SERVER_PUBLICBASEURL=http://localhost:5601
    ports:
      - "26010:5601"   # Kibana Web UI
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  readio_postgres_data:
  readio_redis_data:
  readio_nacos_logs:
  readio_nacos_data:
  readio_minio_data:
  readio_milvus_etcd_data:
  readio_milvus_minio_data:
  readio_milvus_data:
  readio_mongodb_data:
  readio_elasticsearch_data:
  readio_elasticsearch_plugins:
