apiVersion: apps/v1
kind: Deployment
metadata:
  name: readio-auth
  namespace: readio
  labels:
    app: readio-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readio-auth
  template:
    metadata:
      labels:
        app: readio-auth
    spec:
      containers:
        - name: readio-auth
          image: readio-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: readio-config
            - secretRef:
                name: readio-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: readio-auth
  namespace: readio
spec:
  selector:
    app: readio-auth
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
