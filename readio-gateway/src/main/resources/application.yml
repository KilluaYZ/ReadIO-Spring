# 本地默认配置；若已接入 Nacos 配置中心，Nacos 中 readio-gateway.yaml 的同名项会覆盖此处（见 doc/nacos-config/README.md）
server:
  port: 9100
spring:
  application:
    name: readio-gateway
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:postgresql://localhost:26001/readio?currentSchema=public
    username: readio
    password: readio
    driver-class-name: org.postgresql.Driver
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes: # 路由需在 spring.cloud.gateway.routes 下，不能放在 server.webflux.discovery 下
        - id: readio-auth
          uri: lb://readio-auth
          predicates:
            - Path=/readio-auth/**
          filters:
            - StripPrefix=1
        - id: readio-admin
          uri: lb://readio-admin
          predicates:
            - Path=/readio-admin/**
          filters:
            - StripPrefix=1
        - id: readio-portal
          uri: lb://readio-portal
          predicates:
            - Path=/readio-portal/**
          filters:
            - StripPrefix=1
        - id: readio-search
          uri: lb://readio-search
          predicates:
            - Path=/readio-search/**
          filters:
            - StripPrefix=1
      default-filters:
        - TokenRelay=
    nacos:
      discovery:
        server-addr: localhost:8848
  data:
    redis:
      database: 0
      port: 26002
      host: localhost
      username: readio
      password: readio
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:9401
      client:
        provider:
          readio-auth:
            issuer-uri: http://127.0.0.1:9401
        registration:
          readio-gateway-oidc:
            provider: readio-auth
            client-name: readio-gateway
            client-id: readio-gateway
            client-secret: 123456
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:9100/login/oauth2/code/readio-gateway-oidc
            scope:
              - openid
              - admin
              - portal
secure:
  ignore:
    urls: #配置白名单路径
      - "/doc.html"
      - "/v3/api-docs/swagger-config"
      - "/*/v3/api-docs/default"
      - "/*/v3/api-docs"
      - "/*/swagger-ui/**"
      - "/webjars/**"
      - "/favicon.ico"
      - "/webjars/**"
      - "/actuator/**"
      - "/readio-auth/**"
      - "/readio-search/**"
      - "/readio-portal/sso/login"
      - "/readio-portal/sso/register"
      - "/readio-portal/sso/getAuthCode"
      - "/readio-portal/home/**"
      - "/readio-portal/product/**"
      - "/readio-portal/alipay/**"
      - "/readio-admin/admin/login"
      - "/readio-admin/admin/register"
      - "/readio-admin/minio/upload"
management:
  endpoints:
    web:
      exposure:
        include: '*' #暴露Actuator的监控端点
  endpoint:
    gateway:
      access: read-only # 启用 /actuator/gateway/routes 等端点（默认关闭），read-only 仅查看不修改路由
    health:
      show-details: always #显示健康的详细信息
    env:
      show-values: always #默认Actuator的环境变量会以****显示，这里开启显示
    configprops:
      show-values: always #默认Actuator的配置属性会以****显示，这里开启显示
    info:
      enabled: true
knife4j:
  gateway:
    enabled: true
    strategy: discover #网关文档聚合方式：服务发现（自动聚合）
    discover:
      version: openapi3 #配置OpenAPI3规范
      enabled: true #配置开启服务发现
      excluded-services: readio-monitor,readio-gateway #排除监控服务与网关自身（网关不暴露 /v3/api-docs）
    tags-sorter: order #配置tag排序规则
    operations-sorter: order #配置operation排序规则
  # 是否从head中读取token
  is-read-header: true
  # token前缀
  token-prefix: Bearer
  # 是否打印banner
  is-print: false
